<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" font-family="Segoe UI, Arial, sans-serif">
  <!-- Week 12 (D10): architecture diagram — AI-Powered Log Analysis
       Using SLMs in Offline/Air-Gapped Environments.
       Mirrors the frozen implementation exactly (Weeks 1-11). -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#36454F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="820" fill="#FFFFFF"/>
  <text x="590" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2761">AI-Powered Log Analysis — Offline System Architecture</text>
  <text x="590" y="68" text-anchor="middle" font-size="14" fill="#555">Fine-tuned Qwen2.5-3B-Instruct + Local RAG · zero internet dependencies (air-gapped)</text>

  <!-- Air-gap boundary -->
  <rect x="30" y="90" width="1120" height="700" rx="14" fill="none" stroke="#990011" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="52" y="116" font-size="14" font-weight="bold" fill="#990011">AIR-GAPPED MACHINE — no internet at any stage (HF_HUB_OFFLINE=1 · TRANSFORMERS_OFFLINE=1 · pip --no-index)</text>

  <!-- Input -->
  <rect x="60" y="150" width="200" height="72" rx="10" fill="#CADCFC" stroke="#1E2761" stroke-width="1.5"/>
  <text x="160" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2761">Raw log file</text>
  <text x="160" y="202" text-anchor="middle" font-size="12" fill="#333">.log / .txt (syslog, app logs)</text>

  <!-- Preprocessing -->
  <rect x="330" y="150" width="240" height="94" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/>
  <text x="450" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2761">Preprocessing (Week 2–3)</text>
  <text x="450" y="197" text-anchor="middle" font-size="12" fill="#333">normalize · mask PII · timestamps</text>
  <text x="450" y="215" text-anchor="middle" font-size="12" fill="#333">split into log windows</text>
  <text x="450" y="234" text-anchor="middle" font-size="11" fill="#777">src/preprocessing/preprocessor.py</text>

  <!-- RAG -->
  <rect x="650" y="150" width="250" height="112" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/>
  <text x="775" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2761">Offline RAG (Week 7)</text>
  <text x="775" y="197" text-anchor="middle" font-size="12" fill="#333">sentence-transformers embedder (local)</text>
  <text x="775" y="215" text-anchor="middle" font-size="12" fill="#333">FAISS top-3 similar incidents</text>
  <text x="775" y="233" text-anchor="middle" font-size="12" fill="#333">context injection into prompt</text>
  <text x="775" y="252" text-anchor="middle" font-size="11" fill="#777">src/rag/rag_retriever.py · data/faiss.index</text>

  <!-- Local stores -->
  <rect x="950" y="150" width="180" height="112" rx="10" fill="#F2F2F2" stroke="#36454F" stroke-width="1.5"/>
  <text x="1040" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#36454F">Local artifacts</text>
  <text x="1040" y="197" text-anchor="middle" font-size="11" fill="#333">models/qwen25-3b/</text>
  <text x="1040" y="214" text-anchor="middle" font-size="11" fill="#333">models/checkpoints/ (LoRA)</text>
  <text x="1040" y="231" text-anchor="middle" font-size="11" fill="#333">models/sentence-transformers/</text>
  <text x="1040" y="248" text-anchor="middle" font-size="11" fill="#333">data/ · offline_packages/</text>

  <!-- SLM -->
  <rect x="330" y="330" width="570" height="118" rx="10" fill="#1E2761"/>
  <text x="615" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Fine-Tuned Small Language Model (Weeks 4–6)</text>
  <text x="615" y="384" text-anchor="middle" font-size="13" fill="#CADCFC">Qwen2.5-3B-Instruct (local weights) + QLoRA LoRA adapter (merged)</text>
  <text x="615" y="404" text-anchor="middle" font-size="13" fill="#CADCFC">chat-template prompt · greedy decoding (deterministic)</text>
  <text x="615" y="426" text-anchor="middle" font-size="11" fill="#9FB4E8">src/training/fine_tune.py · evaluate.py (load_model_and_tokenizer, build_prompt, GENERATION_KWARGS)</text>

  <!-- Parser -->
  <rect x="330" y="500" width="240" height="86" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/>
  <text x="450" y="527" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2761">Output Parser (Week 4)</text>
  <text x="450" y="548" text-anchor="middle" font-size="12" fill="#333">severity · incident type · root cause</text>
  <text x="450" y="566" text-anchor="middle" font-size="12" fill="#333">summary · recommended actions</text>
  <text x="450" y="581" text-anchor="middle" font-size="11" fill="#777">src/training/output_parser.py</text>

  <!-- API -->
  <rect x="650" y="500" width="250" height="86" rx="10" fill="#CADCFC" stroke="#1E2761" stroke-width="1.5"/>
  <text x="775" y="527" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2761">REST API (Week 9)</text>
  <text x="775" y="548" text-anchor="middle" font-size="12" fill="#333">FastAPI · POST /analyze · GET /health</text>
  <text x="775" y="566" text-anchor="middle" font-size="12" fill="#333">models loaded once at startup</text>
  <text x="775" y="581" text-anchor="middle" font-size="11" fill="#555">src/api/api.py</text>

  <!-- Dashboard -->
  <rect x="650" y="620" width="250" height="86" rx="10" fill="#CADCFC" stroke="#1E2761" stroke-width="1.5"/>
  <text x="775" y="647" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2761">Dashboard (Week 10)</text>
  <text x="775" y="668" text-anchor="middle" font-size="12" fill="#333">Streamlit · upload → live analysis</text>
  <text x="775" y="686" text-anchor="middle" font-size="12" fill="#333">severity chart · similar incidents</text>
  <text x="775" y="701" text-anchor="middle" font-size="11" fill="#555">src/dashboard/dashboard.py</text>

  <!-- User -->
  <rect x="60" y="560" width="200" height="86" rx="10" fill="#F2F2F2" stroke="#36454F" stroke-width="1.5"/>
  <text x="160" y="590" text-anchor="middle" font-size="15" font-weight="bold" fill="#36454F">Analyst / Operator</text>
  <text x="160" y="611" text-anchor="middle" font-size="12" fill="#333">browser (localhost) or curl</text>
  <text x="160" y="629" text-anchor="middle" font-size="12" fill="#333">non-technical operation</text>

  <!-- Packaging -->
  <rect x="60" y="700" width="510" height="66" rx="10" fill="#FFFFFF" stroke="#2C5F2D" stroke-width="1.5"/>
  <text x="315" y="726" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C5F2D">Offline Packaging &amp; Validation (Week 11 — D9)</text>
  <text x="315" y="748" text-anchor="middle" font-size="12" fill="#333">package_offline.sh → .tar.gz + SHA-256 · validate_offline.sh (no-internet test) · docker/Dockerfile</text>

  <!-- Evaluation -->
  <rect x="950" y="330" width="180" height="256" rx="10" fill="#F2F2F2" stroke="#36454F" stroke-width="1.5"/>
  <text x="1040" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#36454F">Evaluation (W4/6/8)</text>
  <text x="1040" y="384" text-anchor="middle" font-size="12" fill="#333">198-example test set</text>
  <text x="1040" y="406" text-anchor="middle" font-size="12" fill="#333">Severity acc: 80.8%</text>
  <text x="1040" y="424" text-anchor="middle" font-size="12" fill="#333">Root cause: 89.9%</text>
  <text x="1040" y="442" text-anchor="middle" font-size="12" fill="#333">ROUGE-L: 0.594</text>
  <text x="1040" y="460" text-anchor="middle" font-size="12" fill="#333">Retrieval P@3: 82.0%</text>
  <text x="1040" y="482" text-anchor="middle" font-size="11" fill="#777">baseline vs fine-tuned</text>
  <text x="1040" y="498" text-anchor="middle" font-size="11" fill="#777">vs fine-tuned + RAG</text>
  <text x="1040" y="520" text-anchor="middle" font-size="11" fill="#777">reports/*.md · *.json</text>
  <text x="1040" y="542" text-anchor="middle" font-size="11" fill="#777">manual root-cause</text>
  <text x="1040" y="558" text-anchor="middle" font-size="11" fill="#777">workbook (594 judgments)</text>

  <!-- Arrows -->
  <line x1="260" y1="186" x2="326" y2="192" stroke="#36454F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="197" x2="646" y2="200" stroke="#36454F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775" y1="262" x2="700" y2="326" stroke="#36454F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="244" x2="450" y2="326" stroke="#36454F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="262" x2="1040" y2="326" stroke="#36454F" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="946" y1="220" x2="904" y2="212" stroke="#36454F" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="946" y1="240" x2="904" y2="370" stroke="#36454F" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="450" y1="448" x2="450" y2="496" stroke="#36454F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="540" x2="646" y2="540" stroke="#36454F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="586" x2="680" y2="618" stroke="#36454F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="646" y1="545" x2="264" y2="595" stroke="#36454F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="646" y1="665" x2="264" y2="615" stroke="#36454F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="904" y1="380" x2="946" y2="392" stroke="#36454F" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="300" y="180" font-size="11" fill="#555">upload</text>
  <text x="590" y="188" font-size="11" fill="#555">windows</text>
  <text x="588" y="530" font-size="11" fill="#555">structured</text>
  <text x="588" y="544" font-size="11" fill="#555">result</text>
  <text x="380" y="290" font-size="11" fill="#555">augmented prompt</text>
  <text x="430" y="475" font-size="11" fill="#555">generated text</text>
</svg>
